<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Troupeau</title>
  <meta name="description" content="Le jeu d'ambiance où il faut penser pareil que son équipe. Un téléphone, des équipes, des moutons.">
  <meta name="theme-color" content="#FFF3E2">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Mascotte : mouton original, réutilisé via <use href="#sheep"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="sheep" viewBox="0 0 120 100">
        <g fill="#1B1714">
          <rect x="46" y="70" width="8" height="24" rx="4"/>
          <rect x="60" y="72" width="8" height="22" rx="4"/>
          <rect x="80" y="72" width="8" height="22" rx="4"/>
          <rect x="94" y="70" width="8" height="24" rx="4"/>
        </g>
        <g fill="#1B1714" stroke="#1B1714" stroke-width="7">
          <circle cx="52" cy="50" r="16"/><circle cx="66" cy="37" r="17"/>
          <circle cx="84" cy="35" r="17"/><circle cx="100" cy="46" r="16"/>
          <circle cx="104" cy="62" r="13"/><circle cx="90" cy="71" r="15"/>
          <circle cx="70" cy="73" r="15"/><circle cx="52" cy="66" r="14"/>
          <circle cx="78" cy="55" r="20"/>
        </g>
        <g fill="#FFFFFF">
          <circle cx="52" cy="50" r="16"/><circle cx="66" cy="37" r="17"/>
          <circle cx="84" cy="35" r="17"/><circle cx="100" cy="46" r="16"/>
          <circle cx="104" cy="62" r="13"/><circle cx="90" cy="71" r="15"/>
          <circle cx="70" cy="73" r="15"/><circle cx="52" cy="66" r="14"/>
          <circle cx="78" cy="55" r="20"/>
        </g>
        <g fill="#1B1714">
          <ellipse cx="13" cy="46" rx="10" ry="5" transform="rotate(25 13 46)"/>
          <ellipse cx="47" cy="44" rx="10" ry="5" transform="rotate(-25 47 44)"/>
          <ellipse cx="30" cy="54" rx="16" ry="19"/>
        </g>
        <g fill="#1B1714" stroke="#1B1714" stroke-width="6">
          <circle cx="24" cy="35" r="6"/><circle cx="31" cy="32" r="7"/><circle cx="38" cy="36" r="6"/>
        </g>
        <g fill="#FFFFFF">
          <circle cx="24" cy="35" r="6"/><circle cx="31" cy="32" r="7"/><circle cx="38" cy="36" r="6"/>
          <circle cx="24" cy="52" r="4.6"/><circle cx="36" cy="52" r="4.6"/>
        </g>
        <g fill="#1B1714">
          <circle cx="23" cy="53" r="2.3"/><circle cx="35" cy="53" r="2.3"/>
        </g>
        <g fill="#FF9DB0">
          <ellipse cx="20.5" cy="62" rx="3.4" ry="2.2"/><ellipse cx="39.5" cy="62" rx="3.4" ry="2.2"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <main id="app" aria-live="polite"></main>
  <div id="sheet" class="sheet" hidden></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Troupeau a besoin de JavaScript pour fonctionner.</p></noscript>

  <script src="js/prompts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
